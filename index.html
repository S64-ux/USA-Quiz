<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Quiz - Lighthouse 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .quiz-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .instructions {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: left;
            color: #555;
        }
        
        .instructions h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .instructions ol {
            margin-left: 20px;
            line-height: 1.8;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .info {
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-icon">🇺🇸</div>
        <h1>USA Quiz</h1>
        <p class="subtitle">Lighthouse 4</p>
        
        <div class="instructions">
            <h2>Welcome!</h2>
            <ol>
                <li>Click the button below to start the quiz</li>
                <li>Answer all the questions carefully</li>
                <li>Check your answers when finished</li>
                <li>Good luck! 🎉</li>
            </ol>
        </div>
        
        <a href="The_USA_Quiz_Lighthouse4" class="button">📝 Start Quiz Now</a>
        
        <p class="info">You can take the quiz on your phone or computer</p>
    </div>
</body>
</html>
